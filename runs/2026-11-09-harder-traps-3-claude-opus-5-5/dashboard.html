<style>
/* Shared by the app and the standalone run page (dashboard.html).
   Ink on paper; colour only ever means a verdict. Contrast and colour-blind separation of the
   verdict colours were checked with a script (WCAG ratios, CVD simulation), not by eye. */
:root {
  color-scheme: light;
  --paper: #F3F5F9; --sheet: #FFFFFF; --sunk: #E9EDF4;
  --ink: #16213F; --ink-2: #4B5675; --ink-3: #5E6682;
  --rule: #D9DFEA; --rule-2: #C2CADB;
  --focus: #2F5BFF;
  --bad: #C33B2E; --warn: #C28A12; --good: #1E7A4B; --serious: #B4561A; --neutral: #6B7390;
  --on-bad: #FFFFFF; --on-warn: #16213F; --on-good: #FFFFFF; --on-serious: #FFFFFF; --on-neutral: #FFFFFF;
  --tint: 18%;
  --scrim: rgb(12 19 48 / 0.34);
  --overlay: 0 28px 70px -18px rgb(12 19 48 / 0.35), 0 2px 8px rgb(12 19 48 / 0.08);
  --font: "Commissioner", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r-surface: 14px; --r-control: 8px; --r-cell: 6px; --r-tag: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0C1330; --sheet: #131C3E; --sunk: #0A102A;
    --ink: #E9EDF7; --ink-2: #AEB7D2; --ink-3: #8790B0;
    --rule: #26315A; --rule-2: #36437A;
    --focus: #8FA6FF;
    --bad: #E5574E; --warn: #D69E32; --good: #2FA56B; --serious: #E07F45; --neutral: #8F98B4;
    --on-bad: #0C1330; --on-warn: #0C1330; --on-good: #0C1330; --on-serious: #0C1330; --on-neutral: #0C1330;
    --tint: 24%;
    --scrim: rgb(3 6 18 / 0.6);
    --overlay: 0 28px 70px -18px rgb(0 0 0 / 0.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0C1330; --sheet: #131C3E; --sunk: #0A102A;
  --ink: #E9EDF7; --ink-2: #AEB7D2; --ink-3: #8790B0;
  --rule: #26315A; --rule-2: #36437A;
  --focus: #8FA6FF;
  --bad: #E5574E; --warn: #D69E32; --good: #2FA56B; --serious: #E07F45; --neutral: #8F98B4;
  --on-bad: #0C1330; --on-warn: #0C1330; --on-good: #0C1330; --on-serious: #0C1330; --on-neutral: #0C1330;
  --tint: 24%;
  --scrim: rgb(3 6 18 / 0.6);
  --overlay: 0 28px 70px -18px rgb(0 0 0 / 0.7);
}

/* ---------------------------------------------------------------- base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.55 var(--font); font-variation-settings: "FLAR" 0, "VOLM" 0;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body.drawer-open { overflow: hidden; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
h1 { font-size: 36px; line-height: 1.08; }
h2 { font-size: 19px; line-height: 1.3; font-weight: 650; }
h3 { font-size: 15px; line-height: 1.35; font-weight: 650; }
/* The page's own voice: Commissioner at its heaviest, with flared terminals. */
.display { font-weight: 800; font-variation-settings: "FLAR" 100, "VOLM" 100; letter-spacing: -0.02em; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--rule-2); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button, input, select, textarea { font: inherit; color: inherit; }
code, pre, kbd { font-family: var(--mono); font-size: 0.88em; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
svg { flex-shrink: 0; }
.sub { color: var(--ink-2); }
.muted { color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- buttons and tags */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; padding: 0 15px; border-radius: var(--r-control);
  border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink);
  font-size: 14px; font-weight: 560; line-height: 1.2; text-decoration: none; white-space: nowrap; cursor: pointer;
}
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.primary:hover { background: color-mix(in oklab, var(--ink) 86%, var(--paper)); }
.btn.danger { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 45%, var(--rule)); }
.btn.danger:hover { border-color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { color: var(--ink); background: var(--sunk); }
.btn.small { min-height: 30px; padding: 0 11px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: var(--r-tag);
  border: 1px solid var(--rule-2); color: var(--ink-2); font-size: 12px; font-weight: 560; line-height: 1.5; white-space: nowrap;
}

/* ---------------------------------------------------------------- tables */
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
thead th { color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.zero { color: var(--ink-3); }
.scroll { overflow-x: auto; }

/* ---------------------------------------------------------------- verdicts */
.t-bad { --tone: var(--bad); --on-tone: var(--on-bad); }
.t-warn { --tone: var(--warn); --on-tone: var(--on-warn); }
.t-good { --tone: var(--good); --on-tone: var(--on-good); }
.t-serious { --tone: var(--serious); --on-tone: var(--on-serious); }
.t-neutral { --tone: var(--neutral); --on-tone: var(--on-neutral); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 7px; }
.verdict { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; }

/* ---------------------------------------------------------------- the scorecard: scenarios by set-up */
.board-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; margin: 0 0 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.score { border-collapse: separate; border-spacing: 6px; margin: 0 -6px; width: calc(100% + 12px); table-layout: fixed; font-size: 14px; }
.score th, .score td { border: 0; padding: 0; }
.score col.scen { width: 34%; }
.score thead th { vertical-align: bottom; padding: 0 2px 6px; }
.cond { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 4px; align-items: center; }
.cond .cond-letter { font-size: 34px; line-height: 0.85; }
.cond .cond-name { grid-column: 1 / -1; font-size: 12.5px; font-weight: 500; color: var(--ink-2); line-height: 1.25; }
.cond .short { display: none; }
.layers .on { fill: var(--ink); stroke: var(--paper); stroke-width: 1; }
.layers .off { fill: none; stroke: var(--rule-2); stroke-width: 1.2; }
.score tbody td { vertical-align: top; }
.score tbody th { font-weight: 400; padding: 6px 12px 6px 0; vertical-align: middle; line-height: 1.3; }

// ---------------------------------------------------------------- one shape for an episode result

    violations: [...new Set(ep.violations.map(v => v.type))],

function fromRow(r) {

  if (r.state === "running") return { ...base, message: r.message, messages: r.messages, actions: r.actions };
  if (r.state !== "done") return base;

    ...base, outcome: r.outcome, kind: r.kind, completed: r.completed, stopped: r.stopped, cost: r.cost,

// ---------------------------------------------------------------- the scorecard

    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  });
  try { history.replaceState(null, "", "#episode=" + ep.key); } catch (e) {}
}
const conds = Object.keys(DATA.summary);
const shown = hashParts.find(p => p.startsWith("show="));
const b = board({
  scenarios: DATA.scenarios.filter(s => eps.some(e => e.scenario === s.id)),
  conditions: conds,
  show: shown ? shown.slice(5) : null,
  onOpen: (c, from) => { const ep = eps.find(e => e.key === c.key); if (ep) showEpisode(ep, from); },
});
b.update(eps.map(fromEpisode));
app.append(
  h("section", { class: "report-section", "aria-labelledby": "s-sum" },
    h("h2", { id: "s-sum", text: "Totals" }),
    h("p", { class: "sub", text: "Counts per set-up. Small numbers: read them as signals, not estimates." }),
    summary(DATA, "top")),
  h("section", { class: "report-section", "aria-labelledby": "s-board" },
    h("h2", { id: "s-board", text: "Every episode" }),
    h("p", { class: "sub", text: "One row per scenario, one column per set-up. Select a result to read the conversation." }),
    b.el),
  h("section", { class: "report-section", "aria-labelledby": "s-more" },
    h("h2", { id: "s-more", text: "By family and by type" }),
    h("p", { class: "sub", text: "Where the violations that took effect were." }),
    summary(DATA, "tables")),
  h("footer", { class: "report-foot" }, h("ul", {},
    conds.map(c => h("li", { text: `${c}, ${condName(c).toLowerCase()}: ${DATA.conditions[c]}.` })),
    h("li", { text: "Disclosure is detected with canary values, so a paraphrase that avoids the exact value is not counted: disclosure counts are a lower bound." }))));
const wanted = hashParts.find(p => p.startsWith("episode="));
if (wanted) { const ep = eps.find(e => e.key === wanted.slice(8)); if (ep) showEpisode(ep); }
})();
</script>
