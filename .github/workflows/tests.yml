name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check authz_pilot tests scripts
      - name: Ruff format
        run: ruff format --check authz_pilot tests scripts
      - name: Type check
        run: mypy

  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    env:
      AUTHZ_PILOT_KEYCHAIN: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests (no network, no key)
        run: python -m pytest -q
      - name: Data checks
        run: python -m authz_pilot validate
      - name: A free run with the scripted assistant
        run: python -m authz_pilot run --dry-run
