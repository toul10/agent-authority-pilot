[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-authority-pilot"
version = "0.1.0"
description = "A small experiment: does an AI agent separate having access, being asked, and being authorised?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Konstantinos Toulis" }]
dependencies = ["anthropic>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["authz_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
